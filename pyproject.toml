[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-shim"
version = "0.1.0"
description = "Universal Agent-Native CLI Adapter — makes legacy CLIs agent-friendly"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
keywords = ["cli", "agent", "adapter", "json", "automation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
shim = "cli_shim:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/cli-shim"
Repository = "https://github.com/yunaremaia/cli-shim"
Issues = "https://github.com/yunaremaia/cli-shim/issues"
Changelog = "https://github.com/yunaremaia/cli-shim/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cli_shim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]